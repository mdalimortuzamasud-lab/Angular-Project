<div class="container mt-4">

    <h3>Category CRUD</h3>

    <form [formGroup]="form" (ngSubmit)="save()">

        <div class="row">

            <div class="col-md-6">

                <label class="form-label">
                    Category Name
                </label>

                <input
                    type="text"
                    class="form-control"
                    formControlName="name">

            </div>

        </div>

        <br>

        <button
            class="btn btn-primary"
            type="submit">

            {{ isEdit ? 'Update' : 'Save' }}

        </button>

        <button
            type="button"
            class="btn btn-secondary ms-2"
            (click)="resetForm()">

            Clear

        </button>

    </form>

    <hr>

    <table class="table table-bordered table-striped">

        <thead>

        <tr>

            <th>ID</th>
            <th>Name</th>
            <th width="180">Action</th>

        </tr>

        </thead>

        <tbody>

        <tr *ngFor="let category of categories">

            <td>{{category.id}}</td>

            <td>{{category.name}}</td>

            <td>

                <button
                    class="btn btn-warning btn-sm"
                    (click)="edit(category)">

                    Edit

                </button>

                <button
                    class="btn btn-danger btn-sm ms-2"
                    (click)="delete(category.id)">

                    Delete

                </button>

            </td>

        </tr>

        </tbody>

    </table>

</div>
