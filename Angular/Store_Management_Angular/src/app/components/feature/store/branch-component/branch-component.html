<div class="card">

    <div class="card-header">
        <h3>{{ selectedId ? 'Update Branch' : 'Add Branch' }}</h3>
    </div>

    <div class="card-body">

        <div class="mb-3">
            <label>Name</label>
            <input
                class="form-control"
                [(ngModel)]="branch.name">
        </div>

        <div class="mb-3">
            <label>Location</label>
            <input
                class="form-control"
                [(ngModel)]="branch.location">
        </div>

        <button
            class="btn btn-success"
            (click)="save()">

            {{ selectedId ? 'Update' : 'Save' }}

        </button>

        <button
            class="btn btn-secondary ms-2"
            (click)="resetForm()">

            Clear

        </button>

    </div>

</div>

<hr>

<table class="table table-bordered">

    <thead>
        <tr>
            <th>#</th>
            <th>Name</th>
            <th>Location</th>
            <th width="180">Action</th>
        </tr>
    </thead>

    <tbody>

        <tr *ngFor="let b of branches; let i = index">

            <td>{{ i + 1 }}</td>
            <td>{{ b.name }}</td>
            <td>{{ b.location }}</td>

            <td>

                <button
                    class="btn btn-warning btn-sm"
                    (click)="edit(b)">

                    Edit

                </button>

                <button
                    class="btn btn-danger btn-sm ms-2"
                    (click)="delete(b.id!)">

                    Delete

                </button>

            </td>

        </tr>

    </tbody>

</table>
