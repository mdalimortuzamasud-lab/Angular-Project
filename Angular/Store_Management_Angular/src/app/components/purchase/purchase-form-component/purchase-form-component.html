<div class="container mt-4" style="max-width: 600px;">

  <h3>{{ isEditMode ? 'Edit Purchase' : 'New Purchase' }}</h3>

  <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>

  <div class="text-center my-4" *ngIf="loading">
    <div class="spinner-border" role="status"></div>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!loading">

    <div class="mb-3">
      <label class="form-label">Supplier</label>
      <select class="form-select" formControlName="supplierId">
        <option [ngValue]="null" disabled>Select supplier</option>
        <option *ngFor="let s of suppliers" [ngValue]="s.id">{{ s.name }}</option>
      </select>
      <div class="text-danger small" *ngIf="form.get('supplierId')?.touched && form.get('supplierId')?.invalid">
        Supplier is required.
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Warehouse</label>
      <select class="form-select" formControlName="warehouseId">
        <option [ngValue]="null" disabled>Select warehouse</option>
        <option *ngFor="let w of warehouses" [ngValue]="w.id">{{ w.name }}</option>
      </select>
      <div class="text-danger small" *ngIf="form.get('warehouseId')?.touched && form.get('warehouseId')?.invalid">
        Warehouse is required.
      </div>
    </div>

    <div class="mb-3" *ngIf="isEditMode">
      <label class="form-label">Total Amount (auto-calculated from items)</label>
      <input type="number" class="form-control" formControlName="totalAmount" readonly>
    </div>

    <div class="mb-3">
      <label class="form-label">Paid Amount</label>
      <input type="number" class="form-control" formControlName="paidAmount" min="0" step="0.01">
      <div class="text-danger small" *ngIf="form.get('paidAmount')?.touched && form.get('paidAmount')?.invalid">
        Paid amount must be 0 or more.
      </div>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary" [disabled]="saving">
        {{ saving ? 'Saving...' : (isEditMode ? 'Update' : 'Create') }}
      </button>
      <button type="button" class="btn btn-outline-secondary" (click)="cancel()">
        Cancel
      </button>
    </div>

    <p class="text-muted small mt-3" *ngIf="!isEditMode">
      After creating the purchase, you'll be taken to its detail page to add products.
    </p>

  </form>

</div>
