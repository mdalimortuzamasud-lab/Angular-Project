<header class="navbar navbar-expand-lg navbar-dark bg-dark px-3 shadow-sm">
  <div class="container-fluid">

    <!-- Logo -->
    <a class="navbar-brand fw-bold" routerLink="/dashboard">
      Store Management
    </a>

    <!-- Mobile Toggle Button -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarContent">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Menu -->
    <div class="collapse navbar-collapse" id="navbarContent">

      <ul class="navbar-nav me-auto mb-2 mb-lg-0">

        <li class="nav-item">
          <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">
            Dashboard
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/branch" routerLinkActive="active">
            Branch
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/warehouse" routerLinkActive="active">
            Warehouse
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/category" routerLinkActive="active">
            Category
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/products" routerLinkActive="active">
            Product
          </a>
        </li>

      </ul>

      <!-- Right Side -->
      <div class="d-flex align-items-center">

        <span class="text-white me-3">
          {{ username }}
          <small class="text-white-50" *ngIf="roleName">
            ({{ roleName }}<ng-container *ngIf="branchName"> · {{ branchName }}</ng-container>)
          </small>
        </span>

        <button class="btn btn-outline-light btn-sm" type="button" (click)="logout()">
          Logout
        </button>

      </div>

    </div>

  </div>
</header>
