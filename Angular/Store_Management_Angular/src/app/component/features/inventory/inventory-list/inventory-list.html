<div class="container mt-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Inventory</h3>
    <a routerLink="/inventory-transactions" class="btn btn-outline-secondary btn-sm">
      View Transaction Log
    </a>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-md-3">
      <select class="form-select" [(ngModel)]="selectedWarehouseId" (ngModelChange)="onWarehouseFilterChange()">
        <option [ngValue]="null">All Warehouses</option>
        <option *ngFor="let w of warehouses" [ngValue]="w.id">{{ w.name }}</option>
      </select>
    </div>
    <div class="col-md-3">
      <select class="form-select" [(ngModel)]="selectedProductId" (ngModelChange)="onProductFilterChange()">
        <option [ngValue]="null">All Products</option>
        <option *ngFor="let p of products" [ngValue]="p.id">{{ p.name }}</option>
      </select>
    </div>
    <div class="col-md-4">
      <input
        type="text"
        class="form-control"
        placeholder="Search product or warehouse..."
        [(ngModel)]="searchTerm">
    </div>
    <div class="col-md-2">
      <button class="btn btn-outline-secondary w-100" (click)="clearFilters()">Clear</button>
    </div>
  </div>

  <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>

  <div class="text-center my-4" *ngIf="loading">
    <div class="spinner-border" role="status"></div>
  </div>

  <table class="table table-hover align-middle" *ngIf="!loading">
    <thead class="table-light">
      <tr>
        <th>Product</th>
        <th>Warehouse</th>
        <th class="text-end">Quantity</th>
        <th class="text-end">Reserved</th>
        <th class="text-end">Available</th>
        <th class="text-end">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let inv of filteredInventories" [class.table-danger]="isOutOfStock(inv)" [class.table-warning]="!isOutOfStock(inv) && isLowStock(inv)">
        <td>{{ inv.productName }}</td>
        <td>{{ inv.warehouseName }}</td>
        <td class="text-end">{{ inv.quantity }}</td>
        <td class="text-end">{{ inv.reservedQuantity }}</td>
        <td class="text-end">
          {{ inv.availableQuantity }}
          <span *ngIf="isOutOfStock(inv)" class="badge bg-danger ms-1">Out of stock</span>
          <span *ngIf="!isOutOfStock(inv) && isLowStock(inv)" class="badge bg-warning text-dark ms-1">Low stock</span>
        </td>
        <td class="text-end">
          <a [routerLink]="['/inventory-transactions']" [queryParams]="{ productId: inv.productId, warehouseId: inv.warehouseId }" class="btn btn-sm btn-outline-primary">
            History
          </a>
        </td>
      </tr>
      <tr *ngIf="filteredInventories.length === 0">
        <td colspan="6" class="text-center text-muted py-4">No inventory records found.</td>
      </tr>
    </tbody>
  </table>

</div>
